site_name: supur1n Network Lab Notes
site_description: ネットワークエンジニアとして学んだことを CML での検証とあわせて残す学習ノート
# GitHub Pages の URL に合わせて書き換えてください
site_url: https://supur1nn.github.io/lab-notes/
repo_url: https://github.com/supur1nn/lab-notes
repo_name: lab-notes

theme:
  name: material
  custom_dir: overrides
  language: ja
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え

plugins:
  - search:
      lang: ja

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

hooks:
  - hooks/page_dates.py

extra_css:
  - stylesheets/extra.css

nav:
  - ホーム: index.md
  - 学習計画:
      - CCIE SP合格までのロードマップ: plan/index.md
  - 勉強記録:
      - study-log/index.md
      - 2026-10-28 MPLS VPNでパケットが運ばれるしくみ: study-log/2026-10-28.md
      - 2026-10-27 RTがあるのになぜRDが必要か: study-log/2026-10-27.md
      - 2026-10-26 IOS XRのmax-metric: study-log/2026-10-26.md
      - 2026-10-23 CML専用機の完成とLinuxのIP設定: study-log/2026-10-23.md
      - 2026-10-18 L3VPNの経路の流れとBGP: study-log/2026-10-18.md
      - 2026-10-17 CML導入とshow ip route: study-log/2026-10-17.md
  - プロトコル:
      - protocols/index.md
      - OSPF:
          - protocols/ospf/index.md
      - BGP:
          - protocols/bgp/index.md
      - MPLS:
          - protocols/mpls/index.md
          - LDPの基本: protocols/mpls/ldp-basic.md
      - VRF:
          - protocols/vrf/index.md
      - Segment Routing:
          - protocols/segment-routing/index.md
      - IOS XR:
          - protocols/ios-xr/index.md
          - ABF: protocols/ios-xr/abf.md
  - 検証:
      - 検証の進め方: verification/workflow.md
      - 検証一覧: verification/index.md
      - OSPF:
          - verification/ospf/index.md
          - OSPFで広報される経路: verification/ospf/advertised-routes.md
          - ループバックだけで有効にしたとき: verification/ospf/loopback-only.md
          - 物理IFだけで有効にしたとき: verification/ospf/physical-if-only.md
          - max-metric（起動時にコスト最大）: verification/ospf/max-metric-on-startup.md
      - MPLS L3VPN:
          - verification/l3vpn/index.md
          - CEの経路がVRFに入るまで: verification/l3vpn/ce-route-to-vrf.md
          - RTがあるのになぜRDが必要か: verification/l3vpn/why-rd.md
          - BGPのネクストホップ: verification/l3vpn/bgp-nexthop.md
          - MPLS VPNを通るパケットの一生: verification/l3vpn/packet-life.md
  - トラブルシューティング:
      - troubleshooting/index.md
      - pingが届かないとき: troubleshooting/ping-unreachable.md
      - OSPFのHelloの間隔が合わないとき: troubleshooting/ospf-hello-interval.md
      - ルータ間のIFがpassiveのとき: troubleshooting/ospf-passive.md
      - ネイバーがEXSTART/EXCHANGEで止まるとき: troubleshooting/ospf-mtu-mismatch.md
  - 参考記事:
      - articles/index.md
      - 参考書一覧: articles/books.md
      - CCIE合格者が使った教材: articles/ccie-study-resources.md
      - CMLの導入と使い方: articles/cml-setup.md
      - 構築・トラシュー自動化: articles/automation.md
  - このサイトについて:
      - サイトの作り方: about/how-this-site-works.md
      - ラボ環境: about/lab-environment.md
      - CMLベアメタル構築: about/cml-baremetal.md
